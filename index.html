<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Почта подтверждена</title>
    <style>
        body {
            font-family: Georgia, 'Times New Roman', serif;
            background-color: #0A1220;
            color: #F5EFE0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            max-width: 500px;
            padding: 40px;
            background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.02) 100%);
            border: 1px solid rgba(201, 162, 39, 0.3);
            border-radius: 20px;
        }
        h1 {
            color: #C9A227;
            font-size: 28px;
            margin-bottom: 20px;
        }
        p {
            font-size: 16px;
            line-height: 1.6;
            color: #9BA0AB;
        }
        .gold {
            color: #C9A227;
            font-weight: 600;
        }
        .footer {
            margin-top: 30px;
            font-style: italic;
            color: #C9A227;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✦ Почта подтверждена</h1>
        <p>Спасибо. Возвращайтесь в приложение <span class="gold">«Молитва»</span> и войдите с вашим email и паролем.</p>
        <p class="footer">«Молитесь друг за друга» (Иак. 5:16)</p>
    </div>
</body>
</html>
